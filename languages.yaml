ru:
  PLUGIN_SECRET_SPLIT:
    DESCRIPTION: Хранит выбранные секреты плагинов вне config YAML-файлов
    ENABLED: Включен
    ENABLED_OPTION: Включено
    DISABLED_OPTION: Выключено
    DEBUG_LOGGING: Отладочное логирование
    DEBUG_LOGGING_HELP: Записывать отладочные сообщения Secret Split в лог Grav.
    ADMIN_SIDEBAR_ITEM: Пункт в боковом меню
    ADMIN_SIDEBAR_ITEM_HELP: Показывать ярлык Secret Split в левом меню админки, ведущий на эту страницу настроек.
    BASE_STORAGE_FILE: Базовый файл секретов
    ENVIRONMENT_STORAGE_PATTERN: Шаблон env-файла секретов
    PROTECTED_PLUGINS: Защищаемые плагины
    ADD_PLUGIN: Добавить плагин
    PLUGIN: Плагин
    PROTECTED_FIELDS: Защищаемые поля
    ADD_FIELD: Добавить поле
    FIELD: Поле
    LABEL_CONTEXT:
      SITE: Site
      ADMIN: Admin
    STATUS:
      TITLE: Статус
      STORED: Хранится
      PENDING: Ожидает
      DUPLICATE: Дублируется
      MISSING: Не задано
    SOURCE:
      BASE_SECRETS: Secrets-файл
      ENV_SECRETS: Env secrets-файл
      BASE_CONFIG: Config
      ENV_CONFIG: Env config
      NOT_SET: Не задано
      DUPLICATE: "%tracked% config, %secrets% secrets-файл"
    OVERVIEW:
      STORED: Хранится
      PENDING: Ожидает
      DUPLICATE: Дублируется
      MISSING: Не задано
      MIGRATE_TO_FILE: Перенести в %file%
      NOTE_TO_FILE: Значения со статусами «Ожидает» и «Дублируется» будут перенесены в %file% и удалены из config YAML.
      RETURN_TO_CONFIG: Перенести в config
      RETURN_NOTE_FROM_FILE: Текущие значения из %file% будут записаны обратно в config YAML и удалены из %file%.
      SAVE_FIRST_NOTE: Сохраните форму, чтобы применить выбранную миграцию или возврат.
    MESSAGES:
      INVALID_TOKEN: Неверный токен безопасности.
      MIGRATED: "Secret Split перенес %migrated% ожидающих полей%duplicates%."
      RETURNED: "Secret Split перенес %returned% сохраненных значений обратно в config."
      ACTION_FAILED: "Ошибка Secret Split: %error%."
      DUPLICATE_SUFFIX: " и %normalized% дублирующихся"
    PAGE:
      TITLE: Secret Split
      SUBTITLE: Защищённые поля и где сейчас лежат их секреты
      LOADING: Загрузка…
      SAVED: Сохранено
      NO_FIELDS: Нет полей
      MIGRATE_CONFIRM: Перенести ожидающие и дублирующиеся значения в secrets-файл?
      RETURN_CONFIRM: Записать секреты обратно в config YAML и удалить их из secrets-файла?
      EMPTY_OVERVIEW: Защищённых полей пока нет — выберите плагин ниже и отметьте, что должно уйти из конфигов.
      PICK_PLUGIN: Защитить поля
      CHOOSE_PLUGIN: Выберите плагин…
