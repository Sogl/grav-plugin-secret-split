en:
  PLUGIN_SECRET_SPLIT:
    DESCRIPTION: Store selected plugin secrets outside config YAML files
    ENABLED: Enabled
    ENABLED_OPTION: Enabled
    DISABLED_OPTION: Disabled
    DEBUG_LOGGING: Debug logging
    DEBUG_LOGGING_HELP: Write Secret Split debug entries into the Grav log.
    ADMIN_SIDEBAR_ITEM: Sidebar menu entry
    ADMIN_SIDEBAR_ITEM_HELP: Show a Secret Split shortcut in the left admin sidebar, linking to this settings page.
    BASE_STORAGE_FILE: Base storage file
    ENVIRONMENT_STORAGE_PATTERN: Environment storage pattern
    PROTECTED_PLUGINS: Protected plugins
    ADD_PLUGIN: Add plugin
    PLUGIN: Plugin
    PROTECTED_FIELDS: Protected fields
    ADD_FIELD: Add field
    FIELD: Field
    LABEL_CONTEXT:
      SITE: Site
      ADMIN: Admin
    STATUS:
      TITLE: Status
      STORED: Stored
      PENDING: Pending
      DUPLICATE: Duplicated
      MISSING: Missing
    SOURCE:
      BASE_SECRETS: Secrets file
      ENV_SECRETS: Environment secrets file
      BASE_CONFIG: Config
      ENV_CONFIG: Environment config
      NOT_SET: Not set
      DUPLICATE: "%tracked% config, %secrets% secrets file"
    OVERVIEW:
      STORED: Stored
      PENDING: Pending
      DUPLICATE: Duplicated
      MISSING: Missing
      MIGRATE_TO_FILE: Move to %file%
      NOTE_TO_FILE: Pending and duplicate values will be moved into %file% and removed from config YAML.
      RETURN_TO_CONFIG: Move to config
      RETURN_NOTE_FROM_FILE: Current values from %file% will be written back into config YAML and removed from %file%.
      SAVE_FIRST_NOTE: Save this form to apply the selected migrate or return action.
    MESSAGES:
      INVALID_TOKEN: Invalid security token.
      MIGRATED: "Secret Split moved %migrated% pending fields%duplicates%."
      RETURNED: "Secret Split moved %returned% stored values back into config."
      ACTION_FAILED: "Secret Split action failed: %error%."
      DUPLICATE_SUFFIX: " and %normalized% duplicated fields"
    PAGE:
      TITLE: Secret Split
      SUBTITLE: Protected fields and where their secrets currently live
      LOADING: Loading…
      SAVED: Saved
      NO_FIELDS: No fields
      MIGRATE_CONFIRM: Move pending and duplicated values into the secrets file?
      RETURN_CONFIRM: Write secrets back into config YAML files and remove them from the secrets file?
      EMPTY_OVERVIEW: No protected fields yet — pick a plugin below and tick what should leave the config files.
      PICK_PLUGIN: Protect fields
      CHOOSE_PLUGIN: Choose a plugin…
